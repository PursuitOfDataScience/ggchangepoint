# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # 'mcp' imports 'rjags', which needs JAGS -- a system library installed
      # below on Linux and macOS but not readily on Windows. A suggested
      # package that will not install is a NOTE here rather than an ERROR;
      # every use of it in the package is guarded with requireNamespace().
      _R_CHECK_FORCE_SUGGESTS_: false
      # How many lines of the vignette-rebuild log R CMD check shows. It
      # keeps the LAST n and prefixes "...", so the default of 10 hides the
      # error and 0 hides everything -- make it big enough to show the lot.
      _R_CHECK_VIGNETTES_NLINES_: 1000
      # The same trap for the test log, and it cost a CI cycle to learn
      # twice: R CMD check keeps the LAST n lines, default 13. A Windows run
      # failed with thirteen identical "there is no package called
      # 'RSpectra'" lines -- an upstream loading diagnostic, not the failure
      # -- and the testthat failure names had been pushed off the top, so
      # they appeared in neither `gh run view --log-failed` nor the full
      # job log. They were never written at all.
      _R_CHECK_TESTS_NLINES_: 1000

    steps:
      - uses: actions/checkout@v4

      - name: Install JAGS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jags

      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: brew install jags

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # R CMD check rebuilds vignettes in parallel and reports nothing at all
      # when a worker dies: the ones still in flight print "re-building" and
      # stop, with no chunk, no line number and no message. Rebuilding them
      # one at a time on the runner that failed is the only way to see which
      # one it is.
      - name: Diagnose the vignette rebuild
        if: failure()
        run: |
          R CMD INSTALL --no-manual .
          echo "--- 1. rmarkdown::render(), one at a time ---"
          Rscript -e 'for (v in list.files("vignettes", "[.]Rmd$", full.names = TRUE)) {
            cat("\n=====", v, "=====\n")
            r <- tryCatch({rmarkdown::render(v, output_dir = tempdir(), quiet = TRUE); "ok"},
                          error = function(e) paste("ERROR:", conditionMessage(e)))
            cat(r, "\n")
          }'
          echo "--- 2. tools::buildVignettes(), which is what R CMD check runs ---"
          Rscript -e 'd <- file.path(tempdir(), "pkg"); dir.create(d)
            file.copy(c("DESCRIPTION","NAMESPACE","R","vignettes","inst","man"), d,
                      recursive = TRUE)
            r <- tryCatch({tools::buildVignettes(dir = d, ser_elibs = NULL); "ok"},
                          error = function(e) paste("ERROR:", conditionMessage(e)))
            cat(r, "\n")
            cat("produced:", paste(list.files(file.path(d, "vignettes"),
                                              "[.]html$"), collapse = ", "), "\n")'
          echo "--- 3. anything the check left behind ---"
          find check -name "build_vignettes.log" -exec cat {} \; 2>/dev/null || true
          find check -name "*.Rout.fail" -exec sh -c 'echo "== $1"; tail -60 "$1"' _ {} \; 2>/dev/null || true
        shell: bash
