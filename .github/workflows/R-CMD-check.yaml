# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # 'mcp' imports 'rjags', which needs JAGS -- a system library installed
      # below on Linux and macOS but not readily on Windows. A suggested
      # package that will not install is a NOTE here rather than an ERROR;
      # every use of it in the package is guarded with requireNamespace().
      _R_CHECK_FORCE_SUGGESTS_: false
      # How many lines of the vignette-rebuild log R CMD check shows. It
      # keeps the LAST n and prefixes "...", so the default of 10 hides the
      # error and 0 hides everything -- make it big enough to show the lot.
      _R_CHECK_VIGNETTES_NLINES_: 1000
      # The same trap for the test log, and it cost a CI cycle to learn
      # twice: R CMD check keeps the LAST n lines, default 13. A Windows run
      # failed with thirteen identical "there is no package called
      # 'RSpectra'" lines -- an upstream loading diagnostic, not the failure
      # -- and the testthat failure names had been pushed off the top, so
      # they appeared in neither `gh run view --log-failed` nor the full
      # job log. They were never written at all.
      _R_CHECK_TESTS_NLINES_: 1000

    steps:
      - uses: actions/checkout@v4

      - name: Install JAGS (Linux)
        if: runner.os == 'Linux'
        # `apt-get update` exits non-zero if ANY configured repository fails,
        # and the runner image ships third-party lists this package has
        # nothing to do with. On 2026-09-09 Google's Chrome index returned
        # "Hash Sum mismatch" and took down all three Linux jobs plus the
        # pkgdown workflow, on a commit whose previous run had passed on all
        # five runners. So: drop the third-party lists first, then update,
        # then let ONLY the jags install decide the step's exit status. JAGS
        # itself is optional here (`_R_CHECK_FORCE_SUGGESTS_: false` above,
        # and every use of mcp is guarded), so even a genuine failure to
        # fetch it should leave the check running rather than abort it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y jags || \
            echo "::warning::jags did not install; mcp-dependent tests will skip"

      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: brew install jags

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          # Pinned so the dependency cache can be invalidated deliberately;
          # there was no way to do that before.
          #
          # It was bumped to 2 while chasing an R-devel failure inside this
          # step, before `R CMD check` had started:
          #
          #   x Failed to download xts 0.14.3 (source)
          #   ! error in pak subprocess
          #   Caused by error in `select_next_task(state)`:
          #   ! Cannot select new package installation task.
          #
          # The guess was a stale cached lockfile pinning an unfetchable
          # URL, since two plain re-runs reproduced it byte for byte. **That
          # was wrong, and the bump disproved it**: the run after it logged
          # `Cache not found for input keys: ...-2-...`, built a fresh
          # lockfile, fetched 328 packages -- and `xts` failed again while
          # 300+ other source tarballs from the same CDN in the same batch
          # succeeded.
          #
          # So it is one object on cloud.R-project.org that this runner
          # cannot fetch, which is neither the cache nor this package. Only
          # R-devel is affected because `use-public-rspm: true` gets the
          # other four a *binary* for xts; R-devel has no binaries and must
          # build from source. `_R_CHECK_FORCE_SUGGESTS_: false` above means
          # the check itself tolerates a missing xts -- it is the install
          # step that will not.
          #
          # Do not bump this expecting it to fix a download. The rule the
          # episode actually supports is narrower than the one first
          # written here: an install that fails on a *single named package*
          # while its batch-mates succeed is that object upstream, and
          # re-running or cache-busting cannot help.
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # R CMD check rebuilds vignettes in parallel and reports nothing at all
      # when a worker dies: the ones still in flight print "re-building" and
      # stop, with no chunk, no line number and no message. Rebuilding them
      # one at a time on the runner that failed is the only way to see which
      # one it is.
      - name: Diagnose the vignette rebuild
        if: failure()
        run: |
          R CMD INSTALL --no-manual .
          echo "--- 1. rmarkdown::render(), one at a time ---"
          Rscript -e 'for (v in list.files("vignettes", "[.]Rmd$", full.names = TRUE)) {
            cat("\n=====", v, "=====\n")
            r <- tryCatch({rmarkdown::render(v, output_dir = tempdir(), quiet = TRUE); "ok"},
                          error = function(e) paste("ERROR:", conditionMessage(e)))
            cat(r, "\n")
          }'
          echo "--- 2. tools::buildVignettes(), which is what R CMD check runs ---"
          Rscript -e 'd <- file.path(tempdir(), "pkg"); dir.create(d)
            file.copy(c("DESCRIPTION","NAMESPACE","R","vignettes","inst","man"), d,
                      recursive = TRUE)
            r <- tryCatch({tools::buildVignettes(dir = d, ser_elibs = NULL); "ok"},
                          error = function(e) paste("ERROR:", conditionMessage(e)))
            cat(r, "\n")
            cat("produced:", paste(list.files(file.path(d, "vignettes"),
                                              "[.]html$"), collapse = ", "), "\n")'
          echo "--- 3. anything the check left behind ---"
          find check -name "build_vignettes.log" -exec cat {} \; 2>/dev/null || true
          find check -name "*.Rout.fail" -exec sh -c 'echo "== $1"; tail -60 "$1"' _ {} \; 2>/dev/null || true
        shell: bash
