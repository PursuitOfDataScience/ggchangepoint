# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Suggested engines CRAN has archived, from the CRAN archive: pak
      # resolves Suggests as hard requirements, so without them this job
      # stops at dependency setup. See .github/off-cran.R.
      - name: Dependencies CRAN no longer serves
        id: off-cran
        shell: Rscript {0}
        run: |
          source(".github/off-cran.R")
          write_output("refs", archive_refs())

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., ${{ steps.off-cran.outputs.refs }}
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The same archived engines, served from the website as a CRAN-like
      # repository at /repo: DESCRIPTION's Additional_repositories names
      # it, as CRAN policy asks for a suggested package outside CRAN, and
      # it is where users get an engine with no other home (ocp). Built on
      # every deploy, so an archival reaches it without an edit here.
      - name: Publish the engines CRAN no longer serves
        shell: Rscript {0}
        run: |
          source(".github/off-cran.R")
          publish_repo("docs/repo")

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
