# The weekly all-engines run (roadmap §0.9 item 3, §100.2, §106.1).
#
# R-CMD-check.yaml runs the suite with whatever Suggests will install, and
# drops the ones that will not load, because a CRAN-like check must pass
# without them. This job asks the opposite question: with EVERY suggested
# engine installed, does every test pass? And it checks each declared
# dependency against the live CRAN index, so an archival is found here,
# on a schedule, rather than by a user or a broken release.
#
# An archival no longer breaks an install: every workflow installs an
# archived dependency from the CRAN archive, and the website serves it
# (.github/off-cran.R). What fails here is what needs a person: a
# dependency outside CRAN that no declared repository serves, one the
# package gives no install advice for, an engine that will not load, or a
# test that fails.
#
# A failure is reported the way any failed scheduled run is: GitHub emails
# the maintainer. It opens no issues and posts nothing.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

name: all-engines

permissions: read-all

jobs:
  cran-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Every declared dependency is on CRAN or a declared repository
        shell: Rscript {0}
        # CRAN's own rule for a dependency outside CRAN (a repository in
        # Additional_repositories serves it), and the package's advice for it
        # (engine_repos() names one). A failure says which package, when and
        # why CRAN archived it, and what to change.
        run: |
          source(".github/off-cran.R")
          check_availability()

  all-engines:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      R_PARALLELLY_MAKENODEPSOCK_SETUP_STRATEGY: sequential
    steps:
      - uses: actions/checkout@v4

      - name: Install JAGS
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y jags

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Dependencies CRAN no longer serves, and one upstream break
        id: off-cran
        shell: Rscript {0}
        run: |
          source(".github/off-cran.R")
          # cpop 1.0.9 does not load with crops 1.0.5 (2026-10-12, the same
          # maintainer): crops stopped exporting the S4 plot() and summary()
          # methods that cpop's NAMESPACE re-exports, so loadNamespace("cpop")
          # fails with "Functions found when exporting methods from the
          # namespace 'cpop' which are not S4 generic". With crops 1.0.4 every
          # cpop test runs. The pin holds only while CRAN has exactly that
          # pair, so it lapses when either ships a fix; a fix that does not
          # work fails the load step below again.
          write_output("refs", c(
            archive_refs(),
            pin_while("crops", "1.0.4", c(crops = "1.0.5", cpop = "1.0.9"))))

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          # local::. installs this checkout too. devtools::test() runs the
          # suite from source, but a future::multisession worker loads
          # ggchangepoint from the library, and the restored dependency
          # cache (pkgdown's shares the key prefix) held the previous
          # release there: the first run's workers had 0.5.0 and failed
          # with 'could not find function "cpt_warn"'.
          extra-packages: any::devtools, local::., ${{ steps.off-cran.outputs.refs }}
          cache-version: 1

      - name: Every suggested engine loads
        shell: Rscript {0}
        # Unlike the CRAN-like check, a Suggests package that will not load
        # is the failure this job exists to report, so it reports why: the
        # first one to fail named only the package, and the cause (another
        # package's release that day) took a reproduction to find.
        run: |
          desc <- read.dcf("DESCRIPTION")
          sug <- trimws(strsplit(gsub("\\([^)]*\\)", "", desc[, "Suggests"]),
                                 ",")[[1]])
          sug <- sug[nzchar(sug)]
          options(rgl.useNULL = TRUE)
          why <- vapply(sug, function(p) {
            tryCatch({
              suppressWarnings(suppressMessages(loadNamespace(p)))
              NA_character_
            }, error = function(e) gsub("\\s+", " ", conditionMessage(e)))
          }, character(1))
          bad <- why[!is.na(why)]
          for (p in names(bad)) {
            v <- tryCatch(as.character(packageVersion(p)),
                          error = function(e) "(not installed)")
            cat("::error::", p, " ", v, " does not load: ", bad[[p]], "\n",
                sep = "")
          }
          if (length(bad)) {
            stop("Suggests that do not load: ", paste(names(bad), collapse = ", "))
          }
          cat(length(sug), "suggested packages, all loading\n")

      - name: The whole suite, every engine present
        shell: Rscript {0}
        run: |
          options(rgl.useNULL = TRUE)
          res <- devtools::test(reporter = testthat::ProgressReporter$new(
            show_praise = FALSE), stop_on_failure = TRUE)
